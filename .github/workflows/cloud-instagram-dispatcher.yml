name: Cloud Instagram Reels Dispatcher ($0 Autonomous Engine)

on:
  schedule:
    # 04:00 UTC = 12:00 PHT
    # 10:30 UTC = 18:30 PHT
    # 13:00 UTC = 21:00 PHT
    # Safety net: Runs every 30 mins to catch any scheduled slot
    - cron: "0,30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dispatch-instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Configure Facebook & Instagram Credentials
        env:
          PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          cat <<EOF > facebook-tokens.json
          {
            "pageId": "$PAGE_ID",
            "pageAccessToken": "$PAGE_ACCESS_TOKEN",
            "instagramBusinessAccountId": "$IG_USER_ID",
            "igUserId": "$IG_USER_ID"
          }
          EOF

      - name: Execute Live Instagram Dispatcher
        run: node scripts/instagram-live-dispatcher.mjs

      - name: Commit & Push Updated Dispatch Queue
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/week1-scheduled-reels.json published-urls-instagram.json || true
          if git diff --staged --quiet; then
            echo "No queue changes to commit."
          else
            git commit -m "chore(instagram): record cloud-dispatched reel status"
            git push
          fi
